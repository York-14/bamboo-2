name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 添付用の静的ファイル一式（任意の静的サーバーのルートに置けば動く）
      - run: npm run build
      - run: cd dist && zip -r "../case-generator-${GITHUB_REF_NAME}.zip" .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "case-generator-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "case-generator-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
          fi
